<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DBI Log Viewer by PremazingPH (v3)</title>
    <style>
        :root {
            --background-color: #FFFFFF;
            --text-color: #000000;
            --border-color: #DDDDDD;
            --highlight-color: #F0F0F0;
        }
        body {
            font-family: "Courier New", monospace;
            margin: 20px;
            background-color: var(--background-color);
            color: var(--text-color);
        }
        h1 { text-align: center; }
        .logo { text-align:center; font-size:60px; font-weight:bold; color:var(--text-color); line-height:1.2; }
        .theme-toggle { display:block; margin:10px auto; padding:10px 20px; font-size:16px; background-color:var(--border-color); color:var(--background-color); border:2px solid var(--border-color); cursor:pointer; width:fit-content; }
        .table-container { margin-top:20px; max-height:70vh; overflow-y:auto; border:2px solid var(--border-color); }
        table { width:100%; border-collapse:collapse; }
        thead { position:sticky; top:0; z-index:2; background-color:var(--background-color); border-bottom:2px solid var(--border-color); }
        th, td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--border-color); }
        th { cursor:pointer; }
        .status-success { color: #00AA00; font-weight:bold; }
        .status-warning { color: #D98B00; font-weight:bold; }
        .status-error { color: #AA0000; font-weight:bold; }
        .details-box { display:none; position:fixed; top:20%; left:50%; transform:translate(-50%,-20%); width:60%; max-height:50%; overflow-y:auto; background:var(--text-color); color:var(--background-color); border:2px solid var(--border-color); padding:20px; z-index:1000; }
        .details-header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); margin-bottom:10px; }
        .details-close { background:var(--background-color); color:var(--text-color); border:none; padding:5px 10px; cursor:pointer; }
        .summary { display:flex; gap:12px; justify-content:center; margin:10px 0; }
        input[type="file"] { margin:10px 0; display:block; }
    </style>
</head>
<body>
    <h1>DBI LOG Viewer</h1>
    <div class="logo"><span class="d">D</span><span class="b">B</span><span class="i">I</span></div>

    <button class="theme-toggle" onclick="toggleTheme()">Switch Theme</button>

    <div class="summary">
        <span id="total_log">Total: 0</span>
        <span id="successCount">Success: 0</span>
        <span id="warningCount">Warnings: 0</span>
        <span id="errorCount">Errors: 0</span>
        <span id="abortedCount">Aborted: 0</span>
    </div>

    <div class="log-viewer">
        <input type="file" id="logFile" accept=".log" />
        <div class="table-container">
            <table>
                <thead>
                    <tr class="filter-row">
                        <th></th>
                        <th>
                            <input type="text" id="nameSearchBar" placeholder="Search Name" onkeyup="searchByName()">
                            <br>
                            <select id="nameDropdownFilter" onchange="filterByDropdown(1, this.value)">
                                <option value="">All</option>
                            </select>
                        </th>
                        <th>
                            <select id="statusDropdownFilter" onchange="filterByDropdown(2, this.value)">
                                <option value="">All</option>
                            </select>
                        </th>
                        <th></th>
                    </tr>
                    <tr>
                        <th onclick="sortTable(0,'number')">Entry Number</th>
                        <th onclick="sortTable(1,'alpha')">Name</th>
                        <th onclick="sortTable(2,'alpha')">Status</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="logTable"></tbody>
            </table>
        </div>
    </div>

    <div id="detailsBox" class="details-box">
        <div class="details-header">
            <h2>Details</h2>
            <button class="details-close" onclick="closeDetails()">Close</button>
        </div>
        <pre id="detailsContent"></pre>
    </div>

    <script>
        const logFileInput = document.getElementById('logFile');
        const logTable = document.getElementById('logTable');
        const nameSearchBar = document.getElementById('nameSearchBar');
        const nameDropdown = document.getElementById('nameDropdownFilter');
        const statusDropdown = document.getElementById('statusDropdownFilter');
        const successCount = document.getElementById('successCount');
        const warningCount = document.getElementById('warningCount');
        const errorCount = document.getElementById('errorCount');
        const abortedCount = document.getElementById('abortedCount');
        const totalLog = document.getElementById('total_log');
        const detailsBox = document.getElementById('detailsBox');
        const detailsContent = document.getElementById('detailsContent');

        let allLogs = [];
        let currentDetailIndex = null;

        // File input: reads file and delegates to parseLogData
        logFileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const text = await file.text();
            const isMTP = file.name.includes('MTP');
            // Reset previous results
            allLogs = [];
            renderLogEntries(allLogs);
            parseLogData(text, isMTP);
        });

        // Main parser - DBI path unchanged, MTP path replaced with working logic
        function parseLogData(logData, isMTP) {
            const rows = logData.split(/\r?\n/);
            let currentStep = '';
            let entryDetails = [];
            let entryStatus = 'success';
            let sourceType = isMTP ? 'MTP' : 'Install';
            let statusSet = new Set();

            rows.forEach(rawRow => {
                // Keep raw row but operate on cleanRow (no ANSI codes) for matching
                const cleanRow = removeAnsiCodes(rawRow);
                const row = rawRow; // for preserving color-stripped text in details we already cleaned

                if (isMTP) {
                    // --- MTP logic (working) ---
                    // Detect start: "Create file: /SD/...." OR "Creating object: /ext/..." (some MTP variants use Creating object)
                    const startMatch = cleanRow.match(/^(?:Create file:|Creating object:)\s*(.+)$/i);
                    if (startMatch) {
                        if (currentStep) {
                            allLogs.push({ step: currentStep, details: entryDetails.join('\n'), status: entryStatus, source: sourceType });
                            statusSet.add(entryStatus.toUpperCase());
                        }
                        currentStep = startMatch[1].trim();
                        entryDetails = [];
                        entryStatus = 'pending';
                        // store the start line
                        entryDetails.push(cleanRow.trim());
                        return;
                    }

                    // Detect explicit success or abort markers
                    if (/Title installation complete/i.test(cleanRow) || /Game installation complete/i.test(cleanRow) || /Total install time:/i.test(cleanRow)) {
                        // If Title installation complete occurs, mark success
                        // NOTE: some logs have a "Total install time" right after success - treat it as success context
                        if (currentStep) entryStatus = 'success';
                        entryDetails.push(cleanRow.trim());
                        // When we see finalizing lines, push entry now (some logs have multiple success lines)
                        if (currentStep) {
                            allLogs.push({ step: currentStep, details: entryDetails.join('\n'), status: entryStatus, source: sourceType });
                            statusSet.add(entryStatus.toUpperCase());
                            currentStep = '';
                            entryDetails = [];
                            entryStatus = 'success';
                        }
                        return;
                    }

                    // Some failures are explicit
                    if (/Installation aborted/i.test(cleanRow) || /\[TRANSFER ABORTED\]/i.test(cleanRow) || /Transfer aborted/i.test(cleanRow)) {
                        if (currentStep) entryStatus = 'error';
                        entryDetails.push(cleanRow.trim());
                        // push on abort
                        if (currentStep) {
                            allLogs.push({ step: currentStep, details: entryDetails.join('\n'), status: entryStatus, source: sourceType });
                            statusSet.add(entryStatus.toUpperCase());
                            currentStep = '';
                            entryDetails = [];
                            entryStatus = 'error';
                        }
                        return;
                    }

                    // If none of the above, collect other useful lines (transfers, signature warnings, hashes)
                    // Also mark warning when signature looks invalid/fake/hash mismatches
                    if (/\[SIGNATURE:\s*(?:Invalid|Fake)\]/i.test(cleanRow) || /HASH NOT MATCHED|HASH MISMATCH/i.test(cleanRow) || /\[HASH NOT MATCHED TO META\]/i.test(cleanRow)) {
                        // escalate pending to warning or error as appropriate (we keep error highest)
                        if (entryStatus !== 'error') entryStatus = 'warning';
                    }

                    entryDetails.push(cleanRow.trim());
                    return;
                } else {
                    // --- DBI logic (left functionally unchanged, but we still strip ANSI codes when matching) ---
                    const stepMatch = cleanRow.match(/\((\d+)\/\d+\) Installing (.+)/);
                    if (stepMatch) {
                        if (currentStep) {
                            allLogs.push({ step: currentStep, details: entryDetails.join('\n'), status: entryStatus, source: sourceType });
                            statusSet.add(entryStatus.toUpperCase());
                        }
                        currentStep = stepMatch[2].trim();
                        entryDetails = [];
                        entryStatus = 'success';
                        return;
                    }
                }

                // Generic status scanning (applies to both when not already error)
                if (entryStatus !== 'error') {
                    if (/error|installation aborted|transfer aborted|transfer aborted/i.test(cleanRow)) {
                        entryStatus = 'error';
                    } else if (/\[SIGNATURE:\s*(?:Invalid|Fake)\]/i.test(cleanRow) || /HASH NOT MATCHED|HASH MISMATCH/i.test(cleanRow) || /\u001b\[38;2;255;128;0m/.test(rawRow)) {
                        entryStatus = 'warning';
                    } else if (/\u001b\[31;1m/.test(rawRow)) {
                        entryStatus = 'error';
                    }
                }

                // append cleaned line to entryDetails so UI shows stripped text
                entryDetails.push(cleanRow.trim());
            });

            // Push any last pending entry
            if (currentStep) {
                allLogs.push({ step: currentStep, details: entryDetails.join('\n'), status: entryStatus, source: sourceType });
                statusSet.add(entryStatus.toUpperCase());
            }

            // Render and update UI state
            renderLogEntries(allLogs);
            updateStatusDropdown(statusSet);
            updateSummaryCounts(allLogs);
            populateDropdownFilters(allLogs);
        }

        // Render entries in table
        function renderLogEntries(entries) {
            logTable.innerHTML = '';
            entries.forEach((entry, index) => {
                const rowElement = document.createElement('tr');

                // status class mapping
                const cls = entry.status === 'success' ? 'status-success' : entry.status === 'warning' ? 'status-warning' : 'status-error';
                const statusText = (entry.status || 'PENDING').toUpperCase();

                rowElement.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${escapeHtml(entry.step)}</td>
                    <td class="${cls}">${statusText}</td>
                    <td><button onclick="toggleDetails(${index})">Show Details</button></td>
                `;
                logTable.appendChild(rowElement);
            });
            updateSummaryCounts(entries);
        }

        // Fill dropdown filters
        function populateDropdownFilters(entries) {
            const names = [...new Set(entries.map(entry => entry.step))].sort((a,b) => a.localeCompare(b, undefined, {sensitivity:'base'}));
            const statuses = [...new Set(entries.map(entry => (entry.status||'PENDING').toUpperCase()))].sort();
            nameDropdown.innerHTML = `<option value="">All</option>` + names.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');
            statusDropdown.innerHTML = `<option value="">All</option>` + statuses.map(status => `<option value="${status}">${status}</option>`).join('');
        }

        function searchByName() {
            const query = nameSearchBar.value.toLowerCase();
            Array.from(logTable.rows).forEach(row => {
                const name = row.cells[1]?.textContent.trim().toLowerCase();
                row.style.display = name && name.includes(query) ? '' : 'none';
            });
        }

        function toggleDetails(index) {
            if (currentDetailIndex === index) { closeDetails(); return; }
            currentDetailIndex = index;
            const entry = allLogs[index];
            detailsBox.style.display = 'block';
            detailsContent.innerHTML = `<strong>${index + 1} - Name:</strong> ${escapeHtml(entry.step)}\n\n<strong>Details:</strong>\n${escapeHtml(entry.details)}`;
        }

        function closeDetails() {
            detailsBox.style.display = 'none';
            currentDetailIndex = null;
        }

        function removeAnsiCodes(text) {
            // strip common ANSI ESC sequences
            return (text || '').replace(/\x1b\[[0-9;]*m/g, '');
        }

        function filterByDropdown(columnIndex, value) {
            Array.from(logTable.rows).forEach(row => {
                const cellValue = row.cells[columnIndex]?.textContent.trim();
                row.style.display = !value || cellValue === value ? '' : 'none';
            });
        }

        function updateStatusDropdown(statusSet) {
            // called in parseLogData; will be overridden by populateDropdownFilters which also sets names
            statusDropdown.innerHTML = '<option value="">All</option>' + Array.from(statusSet).map(status => `<option value="${status}">${status}</option>`).join('');
        }

        function sortTable(columnIndex, type) {
            const rows = Array.from(logTable.rows);
            const isNumeric = type === 'number';
            rows.sort((a,b) => {
                const textA = a.cells[columnIndex]?.textContent.trim();
                const textB = b.cells[columnIndex]?.textContent.trim();
                if (isNumeric) return parseInt(textA, 10) - parseInt(textB, 10);
                return textA.localeCompare(textB, undefined, {sensitivity:'base'});
            });
            logTable.innerHTML = '';
            rows.forEach(row => logTable.appendChild(row));
        }

        function updateSummaryCounts(entries) {
            const total = entries.length;
            const succ = entries.filter(e => (e.status||'').toLowerCase() === 'success').length;
            const warn = entries.filter(e => (e.status||'').toLowerCase() === 'warning').length;
            const err = entries.filter(e => (e.status||'').toLowerCase() === 'error').length;
            const abort = entries.filter(e => {
                const d = (e.details || '').toLowerCase();
                return d.includes('installation aborted') || d.includes('transfer aborted') || d.includes('aborted');
            }).length;
            totalLog.textContent = `Total: ${total}`;
            successCount.textContent = `Success: ${succ}`;
            warningCount.textContent = `Warnings: ${warn}`;
            errorCount.textContent = `Errors: ${err}`;
            abortedCount.textContent = `Aborted: ${abort}`;
        }

        // Minimal escaping to avoid accidental HTML injection from logs
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // Theme toggler preserved
        let currentTheme = 0;
        function toggleTheme() {
            currentTheme = (currentTheme + 1) % 3;
            if (currentTheme === 0) {
                document.documentElement.style.setProperty("--background-color", "#FFFFFF");
                document.documentElement.style.setProperty("--text-color", "#000000");
                document.documentElement.style.setProperty("--border-color", "#DDDDDD");
                document.documentElement.style.setProperty("--highlight-color", "#F0F0F0");
            } else if (currentTheme === 1) {
                document.documentElement.style.setProperty("--background-color", "#0000AA");
                document.documentElement.style.setProperty("--text-color", "#FFFFFF");
                document.documentElement.style.setProperty("--border-color", "#FFFFFF");
                document.documentElement.style.setProperty("--highlight-color", "#000000");
            } else {
                document.documentElement.style.setProperty("--background-color", "#000000");
                document.documentElement.style.setProperty("--text-color", "#FFFFFF");
                document.documentElement.style.setProperty("--border-color", "#FFFFFF");
                document.documentElement.style.setProperty("--highlight-color", "#0000FF");
            }
        }
    </script>
</body>
</html>
